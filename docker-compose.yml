services:

  postgres:
    image: postgres:16
    container_name: fraude-postgres
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - fraud-postgres:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: fraude-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./tcc
    container_name: fraude-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fraud_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IMPORT_STORAGE_PATH: /data/imports
      MODEL_ADMIN_USER: ${MODEL_ADMIN_USER:-admin}
      MODEL_ADMIN_PASSWORD: ${MODEL_ADMIN_PASSWORD:-admin-local}
    ports:
      - "8080:8080"
    volumes:
      - fraud-imports:/data/imports
    restart: unless-stopped

  ml-service:
    build: ./ml-fraud-py
    container_name: fraude-ml
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUD_MODEL_PATH: /app/artifacts/fraud_model.joblib
      FRAUD_CANDIDATE_DIRECTORY: /app/artifacts/candidates
      GENERATIVE_EXPLANATION_ENABLED: ${GENERATIVE_EXPLANATION_ENABLED:-false}
      GENERATIVE_EXPLANATION_URL: ${GENERATIVE_EXPLANATION_URL:-http://ollama:11434/api/generate}
      GENERATIVE_EXPLANATION_MODEL: ${GENERATIVE_EXPLANATION_MODEL:-llama3.2:1b}
      GENERATIVE_EXPLANATION_TIMEOUT_SECONDS: ${GENERATIVE_EXPLANATION_TIMEOUT_SECONDS:-8}
    volumes:
      - fraud-imports:/data/imports:ro
      - fraud-models:/app/artifacts
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.4
    container_name: fraude-ollama
    profiles: ["generative-ai"]
    ports:
      - "11434:11434"
    volumes:
      - fraud-ollama:/root/.ollama
    restart: unless-stopped

  frontend:
    build: ./fraud-dashboard
    container_name: fraude-dashboard
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  fraud-postgres:
  fraud-imports:
  fraud-models:
  fraud-ollama:
